spring:
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/houch}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:비밀번호}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  web:
    resources:
      static-locations: classpath:/static/

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

server:
  error:
    include-message: always

openai:
  api:
    key: ${OPENAI_API_KEY:your-api-key-here}

services:
  spring:
    environment:
      FLASK_API_URL: http://flask:5001/api/recommend

  flask:
  # Flask 설정