<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - HOUCH!</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/mypage.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="sidebar">
  <ul>
    <li><a href="/" aria-label="홈"><i class="fa-solid fa-house"></i></a></li>
    <li><a href="/recommend" aria-label="사용자 맞춤 임대 추천 서비스"><i class="fa-solid fa-check-to-slot"></i></a></li>
    <li><a href="/houses" aria-label="공공임대 경쟁률 랭킹"><i class="fa-solid fa-ranking-star"></i></a></li>
    <li><a href="/map" aria-label="지도로 찾아보기"><i class="fa-solid fa-map-location-dot"></i></a></li>
    <li><a href="/applyhome/gyeonggi-rentals" aria-label="정책 및 보조금"><i class="fa-solid fa-hand-holding-dollar"></i></a></li>
    <li><a href="/chatbot" aria-label="챗봇"><i class="fa-brands fa-bots"></i></a></li>
    <li><a href="/mypage" aria-label="마이페이지"><i class="fa-solid fa-user"></i></a></li>
  </ul>
</div>

<div class="main-content">
  <!-- 프로필 개요 -->
  <div class="profile-overview">
    <div class="profile-header">
      <div class="profile-image">
        <i class="fa-solid fa-user"></i>
      </div>
      <div class="profile-info">
        <h1>김신혼 님</h1>
        <p>예비신혼부부 · 서울시 거주</p>
      </div>
      <button class="edit-profile-btn">프로필 수정</button>
    </div>
  </div>

  <!-- 대시보드 그리드 -->
  <div class="dashboard-grid">
    <!-- 좌측 메뉴 -->
    <div class="dashboard-menu">
      <button class="menu-item active">
        <i class="fa-solid fa-bookmark"></i>
        <span>관심 정책/매물</span>
      </button>
      <button class="menu-item" onclick="location.href='/mypage/applications'">
        <i class="fa-solid fa-file-lines"></i>
        <span>신청 현황</span>
      </button>
      <button class="menu-item">
        <i class="fa-solid fa-bell"></i>
        <span>알림 설정</span>
      </button>
      <button class="menu-item">
        <i class="fa-solid fa-gear"></i>
        <span>계정 설정</span>
      </button>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div class="dashboard-content">
      <!-- 관심 청약 매물 -->
      <div class="content-section">
        <h2>관심 청약 매물</h2>
        <div class="rental-list">
          <!-- 청약 매물 아이템 -->
          <div th:each="rental : ${topFavoriteRentals}" class="rental-item">
            <div class="rental-info">
              <h3 th:text="${rental.houseName}">청약 주택명</h3>
              <p th:text="${rental.address}">주소</p>
              <div class="rental-details">
                <span>총 공급세대: </span>
                <span th:text="${rental.totalSupplyCount} + '세대'">세대 수</span>
              </div>
              <div class="rental-dates">
                <span>청약접수: </span>
                <span th:text="|${rental.subscriptionStartDate} ~ ${rental.subscriptionEndDate}|">접수 기간</span>
              </div>
              <a th:href="${rental.homepageUrl}" target="_blank" class="detail-link">
                상세정보 보기
                <i class="fa-solid fa-arrow-right"></i>
              </a>
            </div>
            <button class="favorite-btn active"
                    th:attr="data-house-id=${rental.houseManageNo}"
                    onclick="removeFavorite(this)">
              <i class="fa-heart fa-solid"></i>
            </button>
          </div>
        </div>

        <!-- 찜한 청약 매물이 없는 경우 -->
        <div th:if="${topFavoriteRentals == null || topFavoriteRentals.isEmpty()}" class="text-center py-4">
          <p>아직 찜한 청약 매물이 없습니다.</p>
          <a href="/applyhome/gyeonggi-rentals" class="btn btn-primary mt-2">청약 매물 둘러보기</a>
        </div>
      </div>

      <!-- 관심 매물 (기존 코드 그대로 유지) -->
      <div class="content-section">
        <div class="section-header d-flex justify-content-between align-items-center">
          <h2>관심 매물
            <span th:text="${favoriteCount != null ? '(' + favoriteCount + ')' : ''}"></span>
          </h2>
          <a href="/favorites" class="btn btn-outline-primary" th:if="${favoriteCount != null && favoriteCount > 3}">
            더 많은 관심 매물 보기
          </a>
        </div>

        <div class="property-grid" th:if="${topFavorites != null && !topFavorites.isEmpty()}">
          <!-- 실제 찜 매물 데이터 -->
          <div th:each="favorite, stat : ${topFavorites}"
               class="property-item"
               th:attr="data-house-id=${favorite.houseInfo.id}">
            <a th:href="@{/houses/{id}(id=${favorite.houseInfo.id})}">
              <div class="property-image"
                   style="background-color: #e0e0e0;height: 186px;">
                <img th:src="@{/apart/apart}  + ${stat.count + 5} + '.jpg'"
                     style="background-color: #e0e0e0;width : 100%;height: 100%;">
              </div>

              <div class="property-info">
                <h3 th:text="${favorite.houseInfo.complexName}">래미안 아파트 1단지</h3>
                <p class="property-location" th:text="${favorite.houseInfo.roadAddress}">서울시 강남구</p>
                <p class="property-price">
                  <span th:text="|보증금 ${#numbers.formatInteger(favorite.houseInfo.deposit, 0, 'COMMA')}원|">보증금 5,800만원</span>
                </p>
              </div>
            </a>
            <button class="favorite-btn active"
                    th:onclick="|toggleFavorite(${favorite.houseInfo.id})|">
              <i class="fa-heart fa-solid"></i>
            </button>
          </div>
        </div>

        <!-- 찜한 매물이 없는 경우 -->
        <div th:if="${topFavorites == null || topFavorites.isEmpty()}" class="text-center py-4">
          <p>아직 찜한 매물이 없습니다.</p>
          <a href="/houses" class="btn btn-primary mt-2">매물 둘러보기</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/mypage.js"></script>
<script>
  function removeFavorite(button) {
    const houseId = button.getAttribute('data-house-id');

    fetch(`/api/favorites/rental/${houseId}`, {
      method: 'POST',
      credentials: 'include'
    })
            .then(response => {
              if (response.status === 401) {
                alert('로그인이 필요합니다.');
                throw new Error('Unauthorized');
              }
              return response.json();
            })
            .then(isFavorited => {
              if (!isFavorited) {
                // 찜 해제 성공 시 해당 항목 제거
                button.closest('.rental-item').remove();
              }
            })
            .catch(error => {
              console.error('찜 해제 오류:', error);
            });
  }
</script>
</body>
</html>
