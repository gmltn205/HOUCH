<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOUCH! ChatBot</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/chatbot.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 마크다운 파서 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <!-- 구글 폰트 추가 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Loading spinner styles */
        .spinner-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: #3498db;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Message with thinking animation */
        .loading-message {
            display: flex;
            align-items: center;
        }

        .loading-dots {
            display: inline-flex;
            margin-left: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background-color: #666;
            border-radius: 50%;
            animation: dot-flashing 1s infinite alternate;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-flashing {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* 비활성화된 입력창 스타일 */
        #userInput:disabled, #sendButton:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* API 선택기 스타일 */
        .api-selector {
            margin-bottom: 10px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 15px;
        }

        .api-selector select {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background-color: white;
            font-family: 'Noto Sans KR', sans-serif;
            margin-left: 10px;
        }

        /* 모드 설명 툴팁 */
        .api-info {
            position: relative;
            display: inline-block;
            margin-left: 5px;
            cursor: pointer;
        }

        .api-info i {
            color: #3498db;
        }

        .api-info .tooltip {
            visibility: hidden;
            width: 250px;
            background-color: #333;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            margin-left: -125px;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .api-info:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        /* 추천 모드 관련 스타일 */
        .recommend-mode {
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #28a745;
        }

        .recommend-example {
            background-color: #e9ecef;
            padding: 8px 12px;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 0.9em;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
        }

        .recommend-example:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <ul>
        <li><a href="/" aria-label="홈"><i class="fa-solid fa-house"></i></a></li>
        <li><a href="/recommend" aria-label="사용자 맞춤 임대 추천 서비스"><i class="fa-solid fa-check-to-slot"></i></a></li>
        <li><a href="/houses" aria-label="공공임대 경쟁률 랭킹"><i class="fa-solid fa-ranking-star"></i></a></li>
        <li><a href="/map" aria-label="지도로 찾아보기"><i class="fa-solid fa-map-location-dot"></i></a></li>
        <li><a href="/applyhome/gyeonggi-rentals" aria-label="정책 및 보조금"><i class="fa-solid fa-hand-holding-dollar"></i></a></li>
        <li><a href="/chatbot" aria-label="챗봇"><i class="fa-brands fa-bots"></i></a></li>
        <li><a href="/mypage" aria-label="마이페이지"><i class="fa-solid fa-user"></i></a></li>
    </ul>
</div>

<div class="main-content">
    <div class="top-bar">
        <div class="logo">HOUCH!</div>
        <div class="user-menu">
            <div id="loggedOutMenu">
                <button class="login-btn" onclick="location.href='/login'">로그인/회원가입</button>
            </div>
            <div id="loggedInMenu" style="display: none;">
                <button class="mypage-btn" onclick="location.href='/mypage'">마이페이지</button>
                <button class="logout-btn" onclick="logout()">로그아웃</button>
            </div>
        </div>
    </div>

    <div class="chatbot-container">
        <div class="chatbot-header">
            <h1>HOUCH! 챗봇</h1>
            <p>공공임대 주택에 대해 무엇이든 물어보세요!</p>
        </div>

        <!-- API 선택 옵션 추가 -->
        <div class="api-selector">
            <label for="apiSelector">챗봇 모드:</label>
            <select id="apiSelector">
                <option value="recommend">추천 모드</option>
            </select>
            <div class="api-info">
                <i class="fa-solid fa-circle-info"></i>
                <span class="tooltip">
                    <strong>추천 모드:</strong> 요구사항에 맞는 주택 추천 (추천!)
                </span>
            </div>
        </div>

        <!-- 추천 모드 안내 -->
        <div class="recommend-mode" id="recommendGuide">
            <strong>💡 추천 모드:</strong> 지역, 예산, 조건 등을 구체적으로 말씀해주시면 최적의 공공임대주택을 추천해드립니다.
            <div class="recommend-example" onclick="useRecommendExample(1)">
                예시: 경기도 성남시에 살 수 있는 공공임대주택을 추천해 주세요.
            </div>
        </div>

        <div class="chat-area" id="chatArea">
            <!-- 챗봇 메시지 -->
            <div class="message bot-message">
                <div class="message-content">
                   안녕하세요! HOUCH! 챗봇입니다. 공공임대주택에 대해 어떤 것이든 물어보세요.
                    <strong><br>👉현재 지역과 예산을 말씀해주시면 최적의 공공임대주택을 추천해드릴게요!</strong>
                </div>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="메시지를 입력하세요...">
            <button id="sendButton">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<!-- 업데이트된 JS 파일 사용 -->
<script src="/js/chatbot-improved.js"></script>

<script>
    // 추천 모드 예시 사용 함수
    function useRecommendExample(exampleNum) {
        const userInput = document.getElementById('userInput');

        if (exampleNum === 1) {
            userInput.value = "경기도 성남시에 살 수 있는 공공임대주택을 추천해 주세요.";
        }

        userInput.focus();
    }

    // 모드에 따라 추천 가이드 표시/숨김 처리
    document.getElementById('apiSelector').addEventListener('change', function(e) {
        const recommendGuide = document.getElementById('recommendGuide');
        if (e.target.value === 'recommend') {
            recommendGuide.style.display = 'block';
        } else {
            recommendGuide.style.display = 'none';
        }
    });

    // 페이지 로드 시 모드 확인
    document.addEventListener('DOMContentLoaded', function() {
        const apiSelector = document.getElementById('apiSelector');
        const recommendGuide = document.getElementById('recommendGuide');

        if (apiSelector.value === 'recommend') {
            recommendGuide.style.display = 'block';
        } else {
            recommendGuide.style.display = 'none';
        }
    });
</script>
</body>
</html>
